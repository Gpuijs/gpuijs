# docs.gpuijs.dev: docs/pages built by docs/build.ts, deployed to this repo's GitHub Pages site.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun docs/build.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
      - id: deploy
        uses: actions/deploy-pages@v4
